# The exact topology grading uses. `answer_service` is your image.
#
# Note `internal: true` on the network: your container can reach the gateway
# and nothing else. This is not a hint, it is the grading environment.
services:
  gateway:
    build: ../gateway
    image: valura-takehome-gateway
    environment:
      UPSTREAM_MODE: "${UPSTREAM_MODE:-stub}"
      UPSTREAM_BASE_URL: "${UPSTREAM_BASE_URL:-}"
      UPSTREAM_API_KEY: "${UPSTREAM_API_KEY:-}"
      MODEL_MAP_FAST: "${MODEL_MAP_FAST:-}"
      MODEL_MAP_DEEP: "${MODEL_MAP_DEEP:-}"
      GATEWAY_PORT: "8600"
    networks: [assessment]

  answer_service:
    build: ..
    environment:
      BOOK_PATH: /data/client_book.json
      MARKET_PATH: /data/market_data.json
      LLM_BASE_URL: http://gateway:8600/v1
      LLM_API_KEY: assessment
      PORT: "8080"
    volumes:
      - ../data/client_book.json:/data/client_book.json:ro
      - ../data/market_data.json:/data/market_data.json:ro
    depends_on: [gateway]
    networks: [assessment]
    read_only: false
    mem_limit: 2g
    cpus: 2.0

networks:
  assessment:
    internal: true
